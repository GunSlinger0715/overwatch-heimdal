# =========================================================
# Heimdal Continuous Integration Workflow
#
# Purpose:
# Automatically validate Heimdal operational intelligence
# architecture on every push and pull request.
#
# Goals:
# - Prevent architectural regressions
# - Validate intelligence subsystem integrity
# - Ensure operational query stability
# - Support disciplined ecosystem evolution
#
# Philosophy:
# Detection without understanding creates noise.
# Detection with interpretation creates intelligence.
# =========================================================

name: Heimdal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Heimdal
        run: |
          python main.py